services:
  vault:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      VAULT_DATA: /data
      BROWSER_SANDBOX: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8765"
    volumes:
      - vault-data:/data
    shm_size: 256mb
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/pwuser:size=128m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/seccomp_profile.json
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vault-data:
